[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-forecast"
version = "0.1.0"
description = "Reproducible league-wide NBA forecasting pipeline"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires the pinned external historical dataset"]

