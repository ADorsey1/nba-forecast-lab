name: Refresh published snapshot
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: published-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: data/raw/llimllib_nba_data
          key: history-${{ runner.os }}-${{ hashFiles('data/history-source.json') }}
      - run: python scripts/setup_history.py
      - run: python scripts/refresh_forecast.py
      - run: python scripts/export_snapshot.py
      - name: Verify exported bundle without runtime pointer
        run: |
          rm data/current.json
          python -m pytest -q
          python scripts/security_audit.py
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed data/raw/live
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated forecast snapshot'
            git push
          fi
